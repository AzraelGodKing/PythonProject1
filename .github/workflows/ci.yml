name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Self-hosted Linux (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, X64, Linux, terramaster, nas, personal, pythonproject1]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
          python -m pip install -e .

      - name: Run unit tests
        run: |
          if [ -d tests ] && find tests -name "test_*.py" -print -quit | grep -q .; then
            echo "Running unit tests with pytest..."
            python -m pytest tests/test_deck.py tests/test_chips.py tests/test_settings.py tests/test_scoreboard.py -v --tb=short
          else
            echo "No tests directory found; skipping unit tests."
          fi

      - name: Run tests with coverage
        run: |
          if [ -d tests ] && find tests -name "test_*.py" -print -quit | grep -q .; then
            echo "Running coverage report..."
            python -m pytest tests/test_deck.py tests/test_chips.py tests/test_settings.py tests/test_scoreboard.py --cov=shared --cov-report=term --cov-report=xml
          else
            echo "No tests found; skipping coverage."
          fi

      - name: Upload coverage to artifacts
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Smoke check (py_compile entry points)
        run: |
          python -m py_compile launcher.py blackjack/gui.py gofish/gui.py minesweeper/gui.py yahtzee/gui.py tic-tac-toe/gui.py tic-tac-toe/ai_vs_ai.py

      - name: Test summary
        if: always()
        run: |
          echo "✅ Tests completed for Python ${{ matrix.python-version }}"
          echo "📊 Check the job output for detailed results"
