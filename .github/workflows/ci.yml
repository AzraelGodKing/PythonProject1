name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Self-hosted Linux (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, X64, Linux, terrramaster, nas, personal, pyhtonproject1]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests (if present)
        run: |
          if [ -d tests ] && find tests -name "test_*.py" -print -quit | grep -q .; then
            python -m unittest discover -s tests -v
          else
            echo "No tests directory found; skipping unit tests."
          fi

      - name: Smoke check (py_compile entry points)
        run: |
          python -m py_compile launcher.py blackjack/gui.py gofish/gui.py minesweeper/gui.py yahtzee/gui.py tic-tac-toe/gui.py tic-tac-toe/ai_vs_ai.py
